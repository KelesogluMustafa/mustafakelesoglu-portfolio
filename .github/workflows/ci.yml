name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  check:
    name: Lint, format, test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Unit and integration tests
        run: npm test
        env:
          NODE_ENV: test
      - name: Smoke-start the server
        run: |
          PORT=3999 node src/server.js &
          sleep 2
          curl -fsS http://127.0.0.1:3999/healthz
          curl -fsS -o /dev/null -w "%{http_code}\n" http://127.0.0.1:3999/de/
          kill %1

  e2e:
    name: Browser flows (Playwright)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser flows
        run: |
          PORT=3999 GLOBAL_RATE_MAX=100000 node src/server.js &
          sleep 2
          BASE_URL=http://127.0.0.1:3999 npm run test:e2e
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: qa/
          if-no-files-found: ignore
