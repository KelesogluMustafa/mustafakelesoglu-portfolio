name: Apply project description minlength fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-minlength-fix.yml'
      - '.github/transfer/minlength-fix.patch'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: git apply .github/transfer/minlength-fix.patch
      - name: Commit cleanup and fix
        run: |
          rm -f .github/transfer/minlength-fix.patch .github/workflows/apply-minlength-fix.yml
          rmdir .github/transfer 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: remove project description minimum length'
          git push origin HEAD:main
