name: Apply UI refinements
on:
  push:
    branches: [fix/ui-content-refinements]
permissions:
  contents: write
jobs:
  apply:
    if: "!contains(github.event.head_commit.message, 'apply UI refinements from reviewed patch')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply reviewed patch
        run: |
          cat .refine/part*.patch > /tmp/refine.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git am /tmp/refine.patch
          rm -rf .refine .github/workflows/apply-refinement.yml
          git add -A
          git commit --amend --no-edit
          git push origin HEAD:fix/ui-content-refinements
