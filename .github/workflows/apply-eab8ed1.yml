name: Apply eab8ed1 transfer

on:
  push:
    branches: [apply-eab8ed1]
    paths:
      - '.github/transfer/eab8ed1.part*'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply transferred commit
        shell: bash
        run: |
          set -euo pipefail
          cat .github/transfer/eab8ed1.part* | base64 -d | gzip -d > /tmp/eab8ed1.patch
          git apply --check --exclude=docs/DECISIONS.md /tmp/eab8ed1.patch
          git apply --exclude=docs/DECISIONS.md /tmp/eab8ed1.patch
          cat .github/transfer/decisions.part* | base64 -d > docs/DECISIONS.md
          rm -f .github/transfer/eab8ed1.part* .github/transfer/decisions.part* .github/workflows/apply-eab8ed1.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: improve contact form and publish SaveFold project status'
          git push origin HEAD:apply-eab8ed1
